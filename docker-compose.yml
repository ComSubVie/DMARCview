services:
  dmarcview:
    build:
      context: .
    # Override to run a published image instead of building locally, e.g.
    #   DMARCVIEW_IMAGE=ghcr.io/<user>/dmarcview:latest docker compose up -d --no-build
    image: ${DMARCVIEW_IMAGE:-dmarcview:1.13.3}
    container_name: dmarcview
    restart: unless-stopped
    init: true
    ports:
      - "${DMARCVIEW_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/dmarc.db
      FRONTEND_DIST: /app/frontend/dist
      GEOIP_DB: /data/geoip/dbip-country-lite.mmdb
    volumes:
      # Database, WAL files and the raw report archive.
      - dmarcview-data:/data
      # Optional local GeoIP database (run scripts/fetch_geoip.sh first).
      - ./geoip:/data/geoip:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  dmarcview-data:
