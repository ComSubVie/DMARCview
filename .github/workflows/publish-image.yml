name: Publish container image

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Backend tests
        working-directory: backend
        run: pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  publish:
    name: Build and push to GHCR
    needs: test
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        run: |
          # GHCR requires lowercase repository names; GitHub owners may not be.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/dmarcview" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Resolve application version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Sync source version from tag
        if: github.ref_type == 'tag'
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python - "$APP_VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path
          version = sys.argv[1]
          path = Path("backend/app/version.py")
          text = path.read_text()
          updated, count = re.subn(
              r'(VERSION\s*=\s*os\.environ\.get\(\"DMARCVIEW_VERSION\", \"\"\)\.strip\(\)\s*or\s*\")[^\"]+(\")',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update VERSION fallback in backend/app/version.py")
          path.write_text(updated)
          print(f"Source version set to {version}")
          PY

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=DMARCView
            org.opencontainers.image.description=Self-hosted DMARC and TLS-RPT reporting dashboard
            org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Container image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Pushed: ${{ github.event_name != 'pull_request' }}"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub fallback notes
        if: steps.exists.outputs.present != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : > fallback-notes.md
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes"             -f tag_name="$TAG"             -f target_commitish="$GITHUB_SHA"             --jq .body > fallback-notes.md 2>/dev/null || {
              echo "GitHub generated notes were unavailable; the release will use a short fallback." >&2
            }

      - name: Generate release notes
        if: steps.exists.outputs.present != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_URL: ${{ vars.DEEPSEEK_API_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/generate_release_notes.py             --tag "$TAG"             --fallback fallback-notes.md             --output release-body.md

      - name: Create release from tag
        if: steps.exists.outputs.present != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then
            image_line="\`${IMAGE}:${version}\`"
            extra=(--prerelease)
          else
            image_line="\`${IMAGE}:${version}\` (and \`:latest\`)"
            extra=(--latest)
          fi

          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${TAG}^" 2>/dev/null || true)

          {
            cat release-body.md
            printf '\n---\n\n'
            if [[ -n "$previous" ]]; then
              printf '**Full Changelog**: %s/%s/compare/%s...%s\n\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$TAG"
            fi
            printf '**Container image:** %s\n\n' "$image_line"
            printf '**Digest:** \`%s\`\n' "$DIGEST"
          } > release-notes.md

          gh release create "$TAG" \
            --title "DMARCView ${version}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${extra[@]}"

          echo "Created ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
